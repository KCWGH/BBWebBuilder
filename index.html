<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlackBerry 빌더</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('bb-theme')||'system'}catch{}</script>
<style>
:root{color-scheme:light;--muted:GrayText;--line:ButtonBorder;--surface:ButtonFace;--error:#ae2424}
:root[data-theme="dark"]{color-scheme:dark;--error:#ffa3a3}
@media(prefers-color-scheme:dark){:root[data-theme="system"]{color-scheme:dark;--error:#ffa3a3}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:Canvas;color:CanvasText;font:14px/1.5 system-ui,sans-serif}
header,main{max-width:1440px;margin:auto;padding:16px 24px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:17px;font-weight:600}h2{margin:0;font-size:14px;font-weight:600}
button,input,select{font:inherit;min-width:0}button,select,input:not([type="checkbox"]){min-height:34px;padding:4px 8px}button{cursor:pointer}
a{color:LinkText;overflow-wrap:anywhere}label{display:block}input:not([type="checkbox"]),.fields select{width:100%}
input[type="checkbox"]{margin:0;flex:none}.theme,.toolbar,.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.theme{flex-wrap:nowrap}
.app-layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(320px,1fr);gap:24px;align-items:start}.builder-panel,.store-panel{min-width:0}
.toolbar{padding-bottom:14px;border-bottom:1px solid var(--line)}#toolStatus{color:var(--muted);font-size:12px;width:100%}
#location,#projectLabel,#empty{color:var(--muted);overflow-wrap:anywhere}#location,#projectLabel{font-size:12px}#empty{margin:20px 0}
#localProject{margin-top:10px}#localProjectHint{flex-basis:100%;overflow-wrap:anywhere}
#jdpPicker{margin-top:12px}#jdps{max-width:100%}#error{color:var(--error);border:1px solid var(--error);padding:10px;margin:0 0 16px;white-space:pre-wrap;overflow-wrap:anywhere}
.settings{padding:18px 0}.settings-heading{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 16px;align-items:end}.fields>div:last-child{grid-column:1/-1}.fields label{color:var(--muted);font-size:12px;margin-bottom:4px}
.workspace{display:grid;gap:16px}.file-panel,.output-panel>section,#storeDetails{border:1px solid var(--line);min-width:0}
.panel-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.files-summary{padding:10px 12px;cursor:pointer;background:var(--surface)}.file-filter{padding:12px 12px 4px}
#tree{overflow:auto;min-height:180px;max-height:min(50vh,420px);padding:6px 12px 12px}#tree ul{list-style:none;margin:0;padding:0}#tree ul.children{margin-left:8px;padding-left:16px;border-left:1px solid var(--line)}#tree summary{cursor:pointer;padding:5px 0;white-space:nowrap}
.folder-content{display:inline-flex;align-items:center;gap:8px;vertical-align:middle}.folder-name{font-weight:600}.folder-count{color:var(--muted);font-size:12px}.file{display:flex;align-items:center;gap:8px;padding:5px 5px 5px 14px;white-space:nowrap;width:max-content;min-width:100%}.file-name{font:12px/1.5 Consolas,'Malgun Gothic',monospace}.missing{color:var(--error)}
.file-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-top:1px solid var(--line)}#count,#status,#moduleCount,#storeStatus{color:var(--muted);font-size:12px}
pre{margin:0;font:12px/1.6 Consolas,'Malgun Gothic',monospace;white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto}#logs{min-height:76px;max-height:240px;padding:12px}#resultArea{margin-top:16px}.result-content{padding:10px 12px 12px}
.downloads{max-height:480px;overflow:auto}
table{border-collapse:collapse;width:100%;table-layout:fixed}td,th{padding:8px 0;border-bottom:1px solid var(--line);text-align:left;overflow-wrap:anywhere}th{font-weight:600;font-size:12px}
#results td:last-child{width:85px;text-align:right;padding-left:10px;color:var(--muted);white-space:nowrap;font-size:12px}#results .cod-toggle td{text-align:center;width:auto;padding:8px 0}#results .cod-toggle button{width:100%}
#otaNotice,#uploadHint{font-size:12px;color:var(--muted);margin:12px 0 0}#uploadResult{padding:10px 0;max-height:150px}
.store-panel{position:sticky;top:16px}#storeDetails .result-content{max-height:calc(100dvh - 150px);overflow:auto}#storeDetails .row{margin-bottom:8px}#storeDetails th,#storeDetails td{padding-right:8px}#storeDetails th:last-child,#storeDetails td:last-child{padding-right:0;width:62px}#storeDetails th:nth-child(2){width:66px}#storeDetails th:nth-child(3){width:76px}#storeDetails td:nth-child(2),#storeDetails td:nth-child(3){font-size:12px}
@media(max-width:900px){.app-layout{grid-template-columns:minmax(0,1fr);gap:20px}.store-panel{position:static}#storeDetails .result-content{max-height:none}}
@media(max-width:600px){header,main{padding:12px}button,select,input:not([type="checkbox"]){min-height:44px}input:not([type="checkbox"]),select{font-size:16px}.toolbar{gap:6px}.fields{gap:12px}.file{min-height:36px}#tree summary{min-height:36px}.panel-heading{gap:6px}.file-footer{flex-wrap:wrap}#build{min-width:84px}#storeDetails th:last-child,#storeDetails td:last-child{width:58px}#storeDetails th:nth-child(2){width:58px}#storeDetails th:nth-child(3){width:67px}}
@media(max-width:360px){.fields{grid-template-columns:minmax(0,1fr)}.fields>div:last-child{grid-column:auto}header{flex-wrap:wrap}}
</style>
</head>
<body>
<header><h1>BlackBerry 빌더</h1><div class="theme"><label for="theme">화면</label><select id="theme"><option value="system">시스템</option><option value="light">라이트</option><option value="dark">다크</option></select></div></header>
<main>
<div id="error" role="alert" hidden></div>
<div class="app-layout"><section class="builder-panel" aria-label="빌드 환경">
<div class="toolbar"><button id="open">JDP 열기</button><button id="folderButton">폴더 가져오기</button><button id="zipButton">ZIP 가져오기</button><span id="toolStatus">도구 확인 중…</span></div>
<p id="location" hidden></p>
<input id="folder" type="file" webkitdirectory multiple hidden><input id="zip" type="file" accept=".zip" hidden>
<input id="jdpFile" type="file" accept=".jdp" hidden><input id="jdpFolder" type="file" webkitdirectory multiple hidden>
<div id="localProject" class="row" style="margin-top:10px" hidden><span id="localProjectHint"></span><button id="selectProjectFolder">프로젝트 폴더 선택</button><button id="cancelLocalProject">취소</button></div>
<div id="jdpPicker" hidden><label for="jdps">JDP</label><select id="jdps"></select></div>
<p id="empty">JDP를 선택한 뒤 해당 프로젝트 폴더를 선택하세요. JDP가 참조하는 파일만 서버로 전송합니다.</p>
<div id="projectArea" hidden>
<section class="settings" aria-label="앱 설정"><div class="settings-heading"><h2>앱 설정</h2><span id="projectLabel"></span></div>
<div class="fields"><div><label for="title">앱 이름</label><input id="title" maxlength="100"></div><div><label for="name">모듈 이름 (영문·숫자·_)</label><input id="name" pattern="[A-Za-z][A-Za-z0-9_]{0,63}"></div><div><label for="vendor">개발자</label><input id="vendor" maxlength="100"></div><div><label for="version">버전</label><input id="version" placeholder="1.0.0"></div><div><label for="icon">아이콘 (16 KiB 이하)</label><select id="icon"></select></div></div></section>
<div class="workspace"><section class="file-panel" aria-label="빌드 파일">
<details id="fileDetails"><summary class="files-summary">빌드 파일</summary><div class="panel-heading"><div class="row"><button id="all">전체 선택</button><button id="none">선택 해제</button><button id="expand">전체 펼치기</button></div></div>
<div class="file-filter"><input id="search" type="search" placeholder="파일·폴더 검색" aria-label="파일·폴더 검색"></div><div id="tree" aria-label="프로젝트 파일"></div>
</details><div class="file-footer"><span id="count"></span><button id="build" >빌드</button></div></section>
<div class="output-panel"><section aria-label="빌드 로그"><div class="panel-heading"><h2>빌드 로그</h2><span id="status" role="status">준비됨</span></div><pre id="logs"></pre></section>
<section id="resultArea" aria-label="빌드 결과" hidden><div class="panel-heading"><h2>빌드 결과</h2><span id="moduleCount"></span></div><div class="result-content"><div class="downloads"><table aria-label="다운로드 파일"><tbody id="results"></tbody></table></div><p id="otaNotice"></p><p id="uploadHint"></p><pre id="uploadResult" hidden></pre></div></section></div>
</div></div>
</section><aside class="store-panel" aria-label="앱스토어 관리">
<details id="storeDetails" open><summary class="files-summary">앱스토어</summary><div class="result-content"><div class="row"><button id="storeRefresh">새로고침</button><span id="storeStatus" role="status"></span></div><div style="overflow:auto"><table aria-label="앱스토어 앱 목록"><thead><tr><th scope="col">앱 이름</th><th scope="col">버전</th><th scope="col">상태</th><th scope="col">관리</th></tr></thead><tbody id="storeApps"></tbody></table></div></div></details>
</aside></div>
</main>
<script src="jdp-import.js"></script><script src="app.js"></script>
</body></html>
